name: watch

on:
  schedule:
    # Every 2 hours. GitHub delays scheduled runs under load; this is best-effort.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      max_comments:
        description: "Comments to pull this run"
        default: "4000"

permissions:
  contents: write
  issues: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: |
          pip install -r requirements.txt
          yt-dlp --version

      - name: Restore YouTube cookies (optional)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            echo "YT_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
            echo "cookies configured"
          else
            echo "no cookies secret set -- YouTube may block this runner"
          fi

      - name: Poll comments
        id: poll
        env:
          MAX_COMMENTS: ${{ github.event.inputs.max_comments || '4000' }}
        # Don't fail the job when YouTube blocks the runner -- just skip this tick.
        continue-on-error: true
        run: python scripts/update.py

      - name: Rebuild ranked candidates
        run: python scripts/rank.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "watch: update guessed words and candidates [skip ci]"
          if ! git push; then
            echo "::error::git push failed -- almost always this means Settings ->"
            echo "::error::Actions -> General -> Workflow permissions is read-only."
            echo "::error::Set it to 'Read and write permissions', then re-run."
            exit 1
          fi

      - name: Open an issue if a winner appeared
        if: hashFiles('WINNER.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh issue list --state open --search "WINNER in:title" --json number \
               --jq 'length' | grep -qv '^0$'; then
            echo "issue already open"
          else
            gh issue create --title "WINNER DETECTED" --body-file WINNER.md
          fi
